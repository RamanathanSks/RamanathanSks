name: Angular CI

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Inject Firebase config
        run: |
          sed -i "s|__FIREBASE_API_KEY__|${{ secrets.APIKEY }}|g" src/environments/environment.prod.ts
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|${{ secrets.AUTHDOMAIN }}|g" src/environments/environment.prod.ts
          sed -i "s|__FIREBASE_DATABASE_URL__|${{ secrets.DATABASEURL }}|g" src/environments/environment.prod.ts
          sed -i "s|__FIREBASE_PROJECT_ID__|${{ secrets.PROJECTID }}|g" src/environments/environment.prod.ts
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|${{ secrets.STORAGEBUCKET }}|g" src/environments/environment.prod.ts
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${{ secrets.MESSAGINGSENDERID }}|g" src/environments/environment.prod.ts
          sed -i "s|__FIREBASE_APP_ID__|${{ secrets.APPID }}|g" src/environments/environment.prod.ts
          sed -i "s|__FIREBASE_MEASUREMENT_ID__|${{ secrets.MEASUREMENTID }}|g" src/environments/environment.prod.ts

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build project
        run: npm run build -- --configuration production --base-href "/${{ github.event.repository.name }}/"
      - name: Deploy GitHub Pages site
        uses: actions/deploy-pages@v4.0.5
        with:
          # GitHub token
          token: ${{ secrets.GITHUB_TOKEN }}
          # Time in milliseconds after which to timeout and cancel the deployment (default: 10 minutes)
          timeout: 600000
          # Maximum number of status report errors before cancelling a deployment (default: 10)
          error_count: 10
          # Time in milliseconds between two deployment status report (default: 5 seconds)
          reporting_interval: 5000
          # Name of the artifact to deploy
          artifact_name: github-pages
          # Is this attempting to deploy a pull request as a GitHub Pages preview site? (NOTE: This feature is only in alpha currently and is not available to the public!)
          preview: false
          publish_dir: dist/RamanathanSks-v2
