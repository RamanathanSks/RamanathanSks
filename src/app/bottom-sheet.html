<div class="bottom-sheet-container">
  <div class="header">
    <h3 class="title">Connect</h3>
    <div class="subtitle">Feel free to reach out to me</div>
  </div>

  <mat-nav-list>
    <a
      mat-list-item
      [href]="mailLink"
      target="_blank"
      (click)="openLink($event)"
      class="connect-item"
    >
      <div class="item-content">
        <div class="icon-container mail">
          <img
            src="https://img.icons8.com/?size=100&id=XfrUdidkiVc7&format=png&color=ffffff"
            alt="Mail"
          />
        </div>
        <div class="text-content">
          <span class="label">Send an Email</span>
          <span class="description">ramanathan.sks@gmail.com</span>
        </div>
        <mat-icon class="chevron">chevron_right</mat-icon>
      </div>
    </a>

    <a
      mat-list-item
      [href]="linkedinurl"
      target="_blank"
      (click)="openLink($event)"
      class="connect-item"
    >
      <div class="item-content">
        <div class="icon-container linkedin">
          <img
            src="https://img.icons8.com/?size=100&id=114445&format=png&color=ffffff"
            alt="LinkedIn"
          />
        </div>
        <div class="text-content">
          <span class="label">LinkedIn Profile</span>
          <span class="description">Professional Network</span>
        </div>
        <mat-icon class="chevron">chevron_right</mat-icon>
      </div>
    </a>
  </mat-nav-list>
</div>

<style>
  .bottom-sheet-container {
    background: #0d0d0d;
    color: white;
    padding: 24px 16px 16px;
    font-family: 'Outfit', sans-serif;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    border-top-left-radius: 38px;
    border-top-right-radius: 38px;
  }

  .header {
    margin-bottom: 16px;
    padding: 0 4px;
  }

  .title {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0;
    color: #fff;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 0.8rem;
    color: #888;
    margin-top: 2px;
    font-weight: 400;
  }

  .connect-item {
    display: block !important;
    height: auto !important;
    padding: 8px 12px !important;
    margin-bottom: 8px !important;
    border-radius: 12px !important;
    background: rgba(255, 255, 255, 0.05) !important;
    border: 1px solid rgba(255, 255, 255, 0.05) !important;
    transition: all 0.2s ease-in-out !important;
  }

  .connect-item:hover {
    background: rgba(255, 255, 255, 0.1) !important;
    transform: scale(1.01);
    border-color: rgba(255, 255, 255, 0.1) !important;
  }

  .item-content {
    display: flex;
    align-items: center;
    width: 100%;
  }

  .icon-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    margin-right: 12px;
    flex-shrink: 0;
  }

  .icon-container img {
    width: 20px;
    height: 20px;
  }

  .icon-container.mail {
    background: linear-gradient(135deg, #ef4444, #991b1b);
  }

  .icon-container.linkedin {
    background: linear-gradient(135deg, #0a66c2, #004182);
  }

  .text-content {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    gap: 2px;
  }

  .label {
    font-size: 0.95rem;
    font-weight: 600;
    color: #fff;
  }

  .description {
    font-size: 0.7rem;
    color: #666;
    font-weight: 400;
  }

  .chevron {
    color: #333;
    font-size: 18px;
    width: 18px;
    height: 18px;
    transition: all 0.2s ease;
  }

  .connect-item:hover .chevron {
    color: #888;
    transform: translateX(2px);
  }
</style>
