<div class="home-container">
  <div class="hero-card">
    <!-- Content Section -->
    <div class="hero-content">
      <div class="welcome-badge">
        Hi all, I'm Ram
        <img
          src="https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f44b.png"
          alt="👋"
          class="wave-img"
          draggable="false"
        />
      </div>

      <h1 class="hero-title">Passion for Coding, Precision for Quality.</h1>

      <p class="hero-description">
        A <span class="highlight-text">Software Engineer</span> &
        <span class="highlight-text">Photography Enthusiast</span>. I specialize in building robust
        CI/CD pipelines and high-performance automation testing frameworks using Playwright,
        Selenium, and Cypress.
      </p>

      <div class="cta-group">
        <button (click)="Connect()" class="btn-primary">Get in Touch</button>
        <a [href]="resumeUrl" target="_blank" class="btn-secondary">Resume</a>
        <a routerLink="/Gallery" class="btn-secondary">Gallery</a>
      </div>
    </div>

    <!-- Media Section -->
    <div class="hero-media">
      <div class="image-wrapper">
        <img
          [class.loaded]="isImageLoaded"
          [src]="imgurl"
          (load)="loadedImg()"
          alt="Ramanathan Profile"
          class="hero-img"
          draggable="false"
        />
      </div>
    </div>
  </div>
</div>
