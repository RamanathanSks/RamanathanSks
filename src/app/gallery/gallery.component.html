<div class="gallery-page">
  <!-- Gallery Hero Header -->
  <header class="gallery-hero">
    <div class="hero-bg-overlay"></div>
    <div class="hero-bg-images">
      <img [src]="topBackgroundImages[0]" class="hero-img-bg bg-1" alt="" draggable="false" />
      <img [src]="topBackgroundImages[1]" class="hero-img-bg bg-2" alt="" draggable="false" />
      <img [src]="topBackgroundImages[2]" class="hero-img-bg bg-3" alt="" draggable="false" />
    </div>
    <div class="hero-content">
      <h1 class="hero-title">Visual Stories</h1>
      <p class="hero-subtitle">Through my lens</p>
    </div>
  </header>

  <!-- Featured Section (Horizontal Scroll) -->
  <section class="featured-section">
    <div class="featured-header">
      <h2 class="featured-title">Highlights</h2>
      <div class="line-accent"></div>
    </div>

    <div class="featured-carousel">
      @for (item of carouselImgList; track $index) {
        <div class="featured-item" (click)="viewPhoto($index)">
          <img
            [src]="item.url"
            [alt]="'Featured ' + $index"
            loading="lazy"
            draggable="false"
            (load)="onImageLoad('featured-' + $index)"
            [class.loaded]="isImageLoaded('featured-' + $index)"
          />
        </div>
      }
    </div>
  </section>

  <!-- Main Masonry Grid -->
  <div class="gallery-wrapper">
    <div class="masonry-grid">
      @for (item of cardsimgList; track $index) {
        <div class="photo-item">
          <img
            [src]="item.url"
            draggable="false"
            loading="lazy"
            alt="Photography Piece"
            (load)="onImageLoad('masonry-' + $index)"
            [class.loaded]="isImageLoaded('masonry-' + $index)"
          />

          <div class="photo-overlay">
            <div class="action-buttons">
              <button class="btn-icon" matTooltip="View Details" (click)="viewPhoto($index)">
                <mat-icon>fullscreen</mat-icon>
              </button>
              <button
                class="btn-icon"
                [class.liked]="item.color === 'warn'"
                [matTooltip]="item.color === 'warn' ? 'Unfavorite' : 'Favorite'"
                (click)="changeColor(item.url)"
              >
                <mat-icon>favorite</mat-icon>
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Dynamic Smooth Carousel Section -->
  <section class="bottom-carousel-section">
    <div
      id="galleryCarousel"
      class="carousel slide carousel-fade"
      data-bs-ride="carousel"
      data-bs-interval="3000"
    >
      <div class="carousel-indicators">
        @for (img of topBackgroundImages; track $index) {
          <button
            type="button"
            data-bs-target="#galleryCarousel"
            [attr.data-bs-slide-to]="$index"
            [class.active]="$index === 0"
          ></button>
        }
      </div>
      <div class="carousel-inner">
        @for (img of topBackgroundImages; track $index) {
          <div class="carousel-item" [class.active]="$index === 0">
            <img [src]="img" class="d-block w-100" alt="Carousel Image" draggable="false" />
          </div>
        }
      </div>
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#galleryCarousel"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#galleryCarousel"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </section>

  <!-- Social Footer Section -->
  <footer class="social-footer">
    <h1>Stay Inspired</h1>
    <p>
      Follow my journey on
      <a [href]="instagramUrl" target="_blank">Instagram</a>
    </p>
  </footer>
</div>
