<div class="app-root">
  <!-- SideNav Content -->
  <mat-sidenav-container>
    <mat-sidenav
      #sidenav
      (mouseleave)="sidenav.toggle()"
      class="sidenavList"
      role="navigation"
      mode="over"
      position="start"
    >
      <div style="height: 100px"></div>
      <!-- SideNav List -->
      <mat-list>
        <mat-list-item matRipple class="parent">
          <a class="sidelink" routerLink="" (click)="sidenav.close()">
            <mat-icon class="sidenavIcon">home</mat-icon>
            <span class="full-width">HOME</span>
          </a>
        </mat-list-item>

        <mat-list-item matRipple class="parent">
          <a class="sidelink" routerLink="Gallery" (click)="sidenav.close()">
            <mat-icon class="sidenavIcon">collections</mat-icon>
            <span class="full-width">GALLERY</span>
          </a>
        </mat-list-item>

        <mat-list-item matRipple class="parent">
          <a class="sidelink" routerLink="About" (click)="sidenav.close()">
            <mat-icon class="sidenavIcon">person</mat-icon>
            <span class="full-width">ABOUT</span>
          </a>
        </mat-list-item>

        <mat-list-item matRipple>
          <a class="sidelink" (click)="Connect(); sidenav.close()">
            <mat-icon class="sidenavIcon">alternate_email</mat-icon>
            <span class="full-width">CONTACT</span>
          </a>
        </mat-list-item>
      </mat-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <!-- Toolbar -->
      @if (offsetFlag) {
        <mat-toolbar class="toolbar mat-elevation-z6">
          <button mat-icon-button (mouseenter)="sidenav.toggle()">
            <mat-icon>menu</mat-icon>
          </button>

          <div class="titlediv">
            <a routerLink="">
              <img
                class="titleimg"
                src="https://firebasestorage.googleapis.com/v0/b/ram-port.appspot.com/o/name.jpeg?alt=media&token=7a43be4a-f41e-4eb2-8731-f96bb8b4bdfc"
                alt="RAMANATHAN"
                draggable="false"
              />
            </a>
          </div>

          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
          </button>
        </mat-toolbar>
      }

      <mat-menu #menu="matMenu">
        <a [href]="codeurl" target="_blank">
          <button mat-menu-item>
            <mat-icon>code</mat-icon>
            <span>Source Code</span>
          </button>
        </a>
        <a [href]="issueurl" target="_blank">
          <button mat-menu-item>
            <mat-icon>bug_report</mat-icon>
            <span>Report Issue</span>
          </button>
        </a>
      </mat-menu>

      <!-- Main Content Area -->
      <main>
        @if (!loader()) {
          <mat-progress-bar mode="indeterminate" color="warn"></mat-progress-bar>
        }
        <router-outlet></router-outlet>

        <!-- Footer -->
        <footer class="footer">
          <div class="footCon">
            <h2 class="footTxt">Stay Connected</h2>
          </div>

          <div class="social-links">
            <a class="smlnk" [href]="githuburl" target="_blank" matTooltip="GitHub">
              <img
                src="https://img.icons8.com/ios-filled/50/ffffff/github.png"
                alt="GitHub"
                class="social-icon"
                draggable="false"
              />
            </a>
            <a class="smlnk" [href]="twitterurl" target="_blank" matTooltip="Twitter / X">
              <img
                src="https://img.icons8.com/ios-filled/50/ffffff/twitterx.png"
                alt="Twitter"
                class="social-icon"
                draggable="false"
              />
            </a>
            <a class="smlnk" (click)="openbarcode()" matTooltip="Instagram">
              <img
                src="https://img.icons8.com/ios-filled/50/ffffff/instagram-new.png"
                alt="Instagram"
                class="social-icon"
                draggable="false"
              />
            </a>
            <a class="smlnk" [href]="facebookurl" target="_blank" matTooltip="Facebook">
              <img
                src="https://img.icons8.com/ios-filled/50/ffffff/facebook-new.png"
                alt="Facebook"
                class="social-icon"
                draggable="false"
              />
            </a>
            <a class="smlnk" [href]="fhpixurl" target="_blank" matTooltip="500px">
              <img
                src="https://img.icons8.com/ios-filled/50/ffffff/500px.png"
                alt="500px"
                class="social-icon"
                draggable="false"
              />
            </a>
          </div>
        </footer>
      </main>

      <!-- GoTop Button -->
      @if (!offsetFlag) {
        <button id="myBtn" (click)="gotop()" matTooltip="Scroll to Top">
          <mat-icon>arrow_upward</mat-icon>
        </button>
      }
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
