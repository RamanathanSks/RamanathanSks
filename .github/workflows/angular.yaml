name: Angular CI

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          FIREBASE_API_KEY: ${{ secrets.APIKEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.AUTHDOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.DATABASEURL }}
          FIREBASE_PROJECT_ID: ${{ secrets.PROJECTID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.STORAGEBUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.MESSAGINGSENDERID }}
          FIREBASE_APP_ID: ${{ secrets.APPID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.MEASUREMENTID }}
        run: npm run build -- --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/RamanathanSks-v2/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
